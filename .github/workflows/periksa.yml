name: Periksa skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Periksa semua skill
        if: github.event_name == 'push'
        run: node tools/periksa.js
      - name: Periksa skill dan perubahan Pull Request
        if: github.event_name == 'pull_request'
        run: node tools/periksa.js --pr "origin/${{ github.base_ref }}"
      # Setelah skill masuk ke main, minta Vercel membangun ulang website (mengambil skill terbaru).
      # VERCEL_DEPLOY_HOOK diisi di Settings > Secrets and variables > Actions.
      - name: Bangun ulang website
        if: github.event_name == 'push'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK belum diisi, website tidak dibangun ulang."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Website sedang dibangun ulang."
